<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>피하기 게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrapper">
    <section class="game-card">
      <header class="game-header">
        <div>
          <h1>피하기 게임</h1>
          <p>떨어지는 장애물을 피해서 30초 동안 버티세요.</p>
        </div>

        <div class="status-panel" aria-label="게임 상태">
          <div class="status-box">
            <span>남은 시간</span>
            <strong id="timeText">30.0</strong>
          </div>
          <div class="status-box">
            <span>점수</span>
            <strong id="scoreText">0</strong>
          </div>
        </div>
      </header>

      <div class="canvas-area">
        <canvas id="gameCanvas" width="480" height="640" aria-label="피하기 게임 화면"></canvas>

        <div id="overlay" class="overlay">
          <h2 id="overlayTitle">피하기 게임</h2>
          <p id="overlayMessage">방향키 ← → 로 이동합니다.</p>

          <form id="nicknameForm" class="record-form hidden">
            <label for="nicknameInput">닉네임을 남겨주세요</label>
            <div class="record-row">
              <input
                id="nicknameInput"
                type="text"
                maxlength="12"
                autocomplete="off"
                placeholder="최대 12자"
              />
              <button type="submit">기록 저장</button>
            </div>
            <p id="saveMessage" class="save-message" aria-live="polite"></p>
          </form>

          <button id="startButton" type="button">게임 시작</button>
        </div>
      </div>

      <section class="ranking-panel" aria-label="플레이 로그 순위표">
        <div class="ranking-header">
          <div>
            <h2>플레이 로그 TOP 10</h2>
            <p>이 브라우저에 저장된 최근 플레이 기록입니다.</p>
          </div>
          <button id="clearRankingButton" class="secondary-button" type="button">기록 초기화</button>
        </div>

        <ol id="rankingList" class="ranking-list"></ol>
        <p id="emptyRankingText" class="empty-ranking">아직 저장된 기록이 없습니다.</p>
      </section>

      <footer class="game-footer">
        <p><strong>조작:</strong> 방향키 ← →</p>
        <p><strong>승리:</strong> 30초 생존 / <strong>패배:</strong> 장애물 충돌</p>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

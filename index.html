<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>악몽의 잔재</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrapper">
    <section class="game-card">
      <header class="game-header">
        <div>
          <h1>악몽의 잔재</h1>
        </div>
      </header>

      <div class="canvas-area">
        <canvas id="gameCanvas" width="480" height="640" aria-label="악몽의 잔재 게임 화면"></canvas>
        <button
          id="settingsButton"
          class="settings-button hidden"
          type="button"
          aria-label="사운드 설정 열기"
          aria-expanded="false"
          aria-controls="soundSettingsPanel"
        >
          ⚙
        </button>

        <div id="soundSettingsPanel" class="settings-panel hidden" role="dialog" aria-label="사운드 설정">
          <div class="settings-header">
            <h2>사운드</h2>
            <button id="closeSettingsButton" class="icon-button" type="button" aria-label="사운드 설정 닫기">×</button>
          </div>

          <label class="volume-control" for="bgmVolumeInput">
            <span>BGM</span>
            <input id="bgmVolumeInput" type="range" min="0" max="100" step="1" />
            <strong id="bgmVolumeValue">28</strong>
          </label>

          <label class="volume-control" for="sfxVolumeInput">
            <span>효과음</span>
            <input id="sfxVolumeInput" type="range" min="0" max="100" step="1" />
            <strong id="sfxVolumeValue">55</strong>
          </label>
        </div>

        <div id="overlay" class="overlay">
          <h2 id="overlayTitle">악몽의 잔재</h2>
          <p id="overlayMessage"></p>

          <form id="nicknameForm" class="record-form hidden">
            <label for="nicknameInput">닉네임을 입력해주세요</label>
            <div class="record-row">
              <input
                id="nicknameInput"
                type="text"
                maxlength="12"
                autocomplete="off"
                placeholder="최대 12자"
              />
              <button type="submit">기록 저장</button>
            </div>
            <p id="saveMessage" class="save-message" aria-live="polite"></p>
          </form>

          <button id="startButton" type="button">게임 시작</button>
          <button id="replayTutorialButton" class="tutorial-replay-button" type="button">튜토리얼</button>
          <button
            id="menuSettingsButton"
            class="menu-settings-button"
            type="button"
            aria-label="사운드 설정 열기"
            aria-expanded="false"
            aria-controls="soundSettingsPanel"
          >
            설정
          </button>
          <button id="mainMenuButton" class="secondary-button hidden" type="button">메인 화면</button>
        </div>

        <div id="tutorialLayer" class="tutorial-layer hidden" role="button" tabindex="0" aria-label="튜토리얼 대사 넘기기" aria-live="polite">
          <div class="tutorial-dialog">
            <div class="tutorial-portrait-frame">
              <img
                id="tutorialPortrait"
                src="asset/npc/npc_dream_manager_portrait.png"
                alt="꿈 관리자 초상화"
              />
            </div>

            <div class="tutorial-copy">
              <strong id="tutorialNpcName">꿈 관리자</strong>
              <p id="tutorialText"></p>
            </div>
          </div>
        </div>

        <div id="abilityLayer" class="ability-layer hidden" aria-live="assertive">
          <div class="ability-dialog" role="dialog" aria-modal="true" aria-labelledby="abilityTitle">
            <span class="ability-kicker">꿈의 불꽃이 흔들립니다</span>
            <h2 id="abilityTitle">능력 선택</h2>
            <p id="abilityMessage">강화할 힘을 하나 선택하세요.</p>
            <div id="abilityOptions" class="ability-options"></div>
          </div>
        </div>
      </div>

      <section class="ranking-panel" aria-label="플레이 로그 순위">
        <div class="ranking-header">
          <div>
            <h2>플레이 로그 TOP 10</h2>
            <p>이 브라우저에 저장된 플레이 기록입니다.</p>
          </div>
          <button id="clearRankingButton" class="secondary-button" type="button">기록 초기화</button>
        </div>

        <ol id="rankingList" class="ranking-list"></ol>
        <p id="emptyRankingText" class="empty-ranking">아직 저장된 기록이 없습니다.</p>
      </section>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

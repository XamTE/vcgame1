<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>피하기 게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrapper">
    <section class="game-card">
      <header class="game-header">
        <div>
          <h1>피하기 게임</h1>
          <p>떨어지는 장애물을 피해서 30초 동안 버티세요.</p>
        </div>

        <div class="status-panel" aria-label="게임 상태">
          <div class="status-box">
            <span>남은 시간</span>
            <strong id="timeText">30.0</strong>
          </div>
          <div class="status-box">
            <span>점수</span>
            <strong id="scoreText">0</strong>
          </div>
        </div>
      </header>

      <div class="canvas-area">
        <canvas id="gameCanvas" width="480" height="640" aria-label="피하기 게임 화면"></canvas>

        <div id="overlay" class="overlay">
          <h2 id="overlayTitle">피하기 게임</h2>
          <p id="overlayMessage">방향키 ← → 로 이동합니다.</p>
          <button id="startButton" type="button">게임 시작</button>
        </div>
      </div>

      <footer class="game-footer">
        <p><strong>조작:</strong> 방향키 ← →</p>
        <p><strong>승리:</strong> 30초 생존 / <strong>패배:</strong> 장애물 충돌</p>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
